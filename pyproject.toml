[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simonto"
version = "0.1.0"
description = "Ontology-driven agent tooling: turn a simulation product's scripting surface into typed, discoverable, validated tools (RDF/OWL, SHACL, SPARQL, MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rdflib>=7.0", "pyshacl>=0.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
simonto = "simonto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
